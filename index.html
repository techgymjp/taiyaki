<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>とべ！たいやきちゃん</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #3b2414;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #mute {
    position: fixed; right: 10px; bottom: 10px;
    width: 44px; height: 44px; border-radius: 22px;
    border: 2px solid #fff3; background: #0006; color: #fff;
    font-size: 20px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="音のオン・オフ">♪</button>
<script type="module">
import { createTaiyakiSprites, renderPlate } from './taiyaki3d.js';
import { createOjisan } from './ojisan3d.js';
{

// ===================== 画面 =====================
const W = 360, H = 640;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ===================== 3Dたい焼き =====================
let sprites = null;
try {
  sprites = createTaiyakiSprites();
  if (sprites) sprites.warm();
} catch (e) { console.warn('3D描画が使えないので2Dで表示します', e); sprites = null; }
const PX_PER_UNIT = 31;
let oj = null;
try { oj = createOjisan({ W, top: 80, bottom: 640, res: Math.min(1.6, (window.devicePixelRatio || 1) * Math.min(1.2, scale)) }); }
catch (e) { console.warn('おじさんの3D描画が使えないので2Dで表示します', e); oj = null; }
const K = PX_PER_UNIT / 41; // 2D の飾りの大きさ

// ===================== 保存 =====================
function loadBest() {
  try { return parseInt(localStorage.getItem('taiyaki-best') || '0', 10) || 0; } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('taiyaki-best', String(v)); } catch (e) {}
}

// ===================== サウンド =====================
const Sound = {
  ctx: null, master: null, bgmGain: null, sfxGain: null,
  muted: false, playing: false, nextTime: 0, step: 0, timer: null,
  tempo: 138,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.8;
    this.master.connect(this.ctx.destination);
    this.bgmGain = this.ctx.createGain();
    this.bgmGain.gain.value = 0.35;
    this.bgmGain.connect(this.master);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.6;
    this.sfxGain.connect(this.master);
    // ノイズバッファ
    const len = this.ctx.sampleRate * 0.5;
    this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.8;
  },
  freq(m) { return 440 * Math.pow(2, (m - 69) / 12); },

  tone(type, midi, t, dur, vol, dest, vib) {
    const c = this.ctx;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(this.freq(midi), t);
    if (vib) {
      const lfo = c.createOscillator();
      const lg = c.createGain();
      lfo.frequency.value = 5.5;
      lg.gain.value = this.freq(midi) * 0.012;
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(t + 0.08); lfo.stop(t + dur + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.setTargetAtTime(vol * 0.6, t + 0.03, 0.08);
    g.gain.setTargetAtTime(0.0001, t + dur * 0.85, 0.03);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.2);
  },
  hat(t, vol) {
    const c = this.ctx;
    const s = c.createBufferSource();
    s.buffer = this.noise;
    const f = c.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 7000;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(this.bgmGain);
    s.start(t); s.stop(t + 0.06);
  },
  kick(t) {
    const c = this.ctx;
    const o = c.createOscillator();
    const g = c.createGain();
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(this.bgmGain);
    o.start(t); o.stop(t + 0.16);
  },

  // ---- オリジナル曲：BPM138・4拍子・短調、ズンチャズンチャのコミカルな哀愁 ----
  // メロディ：A短調（四七抜き＋和声的短音階の G#）。[MIDIノート or null(休符), 長さ(8分音符の数)]
  melody: [
    // A：ためいきのように下がる
    [76,3],[77,1],[76,2],[72,2],
    [71,2],[72,1],[71,1],[69,4],
    [72,2],[76,2],[81,3],[80,1],
    [76,4],[75,1],[76,1],[null,2],
    [77,3],[76,1],[72,2],[69,2],
    [71,2],[72,2],[76,2],[72,2],
    [71,3],[69,1],[68,2],[71,2],
    [69,6],[null,2],
    // B：すこし明るくなって、また沈む
    [81,3],[77,1],[76,2],[77,2],
    [76,3],[72,1],[71,2],[72,2],
    [74,3],[72,1],[71,2],[69,2],
    [68,2],[69,1],[71,1],[76,4],
    // C：増2度（F→G#）でいちばん切なく、最後は「ちゃんちゃん」
    [77,2],[76,1],[77,1],[81,4],
    [80,2],[77,2],[76,4],
    [72,2],[71,1],[72,1],[71,2],[68,2],
    [69,4],[64,1],[null,1],[69,1],[null,1],
  ],
  // コード：[ズン(ルート), ズン(5度), チャ(和音)]
  chords: {
    Am: [45, 40, [57, 60, 64]],
    Dm: [50, 45, [57, 62, 65]],
    E:  [40, 47, [56, 59, 62]],
    F:  [41, 48, [57, 60, 65]],
    C:  [48, 43, [55, 60, 64]],
  },
  // 1小節ごとのコード（2つなら前半・後半）
  progression: [
    'Am', 'Dm', 'Am', 'E',
    'Dm', 'Am', 'E', 'Am',
    'F', 'C', 'Dm', 'E',
    'Dm', 'E', ['Am', 'E'], 'END',
  ],

  // ズン：チューバっぽい低音
  oom(midi, t, dur) {
    const c = this.ctx;
    const o = c.createOscillator(), o2 = c.createOscillator();
    const f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'triangle'; o2.type = 'square';
    o.frequency.setValueAtTime(this.freq(midi) * 0.97, t);
    o.frequency.linearRampToValueAtTime(this.freq(midi), t + 0.04);
    o2.frequency.value = this.freq(midi);
    f.type = 'lowpass'; f.frequency.value = 500;
    const g2 = c.createGain(); g2.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(this.bgmGain);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  },
  // チャ：短く切った和音＋ブラシ
  pah(notes, t, dur) {
    const c = this.ctx;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1800;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.09, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(this.bgmGain);
    for (const m of notes) {
      const o = c.createOscillator();
      o.type = 'square';
      o.frequency.value = this.freq(m);
      o.connect(f);
      o.start(t); o.stop(t + dur + 0.05);
    }
    const s = c.createBufferSource();
    s.buffer = this.noise;
    const nf = c.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 5000; nf.Q.value = 0.7;
    const ng = c.createGain();
    ng.gain.setValueAtTime(0.07, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    s.connect(nf); nf.connect(ng); ng.connect(this.bgmGain);
    s.start(t); s.stop(t + 0.08);
  },
  // メロディ：ハーモニカ風。長い音は下からずり上げて、ゆれるビブラート
  lead(midi, t, dur) {
    const c = this.ctx;
    const o = c.createOscillator(), o2 = c.createOscillator();
    const f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'square'; o2.type = 'sawtooth';
    const fr = this.freq(midi);
    const long = dur > 0.4;
    o.frequency.setValueAtTime(long ? fr * 0.965 : fr, t);
    o.frequency.linearRampToValueAtTime(fr, t + (long ? 0.09 : 0.01));
    o2.frequency.setValueAtTime(fr * 1.004, t);
    if (long) {
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 5;
      lg.gain.setValueAtTime(0, t);
      lg.gain.linearRampToValueAtTime(fr * 0.018, t + dur * 0.6);
      lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.1);
    }
    f.type = 'lowpass'; f.frequency.value = 2200; f.Q.value = 2;
    const g2 = c.createGain(); g2.gain.value = 0.4;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.02);
    g.gain.setTargetAtTime(0.11, t + 0.05, 0.1);
    g.gain.setTargetAtTime(0.0001, t + dur * 0.88, 0.04);
    o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(this.bgmGain);
    o.start(t); o2.start(t); o.stop(t + dur + 0.25); o2.stop(t + dur + 0.25);
  },

  startBgm() {
    if (!this.ctx || this.playing) return;
    this.playing = true;
    this.nextTime = this.ctx.currentTime + 0.1;
    this.melIdx = 0; this.melLeft = 0; this.step = 0;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stopBgm() {
    this.playing = false;
    clearInterval(this.timer);
  },
  schedule() {
    const c = this.ctx;
    while (this.nextTime < c.currentTime + 0.12) {
      const e = 60 / this.tempo / 2; // 8分音符の長さ
      const t = this.nextTime;
      const totalSteps = this.progression.length * 8;
      const s = this.step % totalSteps;
      const bar = Math.floor(s / 8), inBar = s % 8;
      // メロディ
      if (this.melLeft <= 0) {
        const n = this.melody[this.melIdx % this.melody.length];
        if (n[0] !== null) this.lead(n[0], t, e * n[1] * 0.95);
        this.melLeft = n[1];
        this.melIdx++;
      }
      this.melLeft--;
      // 伴奏：ズン(1拍目) チャ(2拍目) ズン(3拍目) チャ(4拍目)
      const pr = this.progression[bar];
      if (pr === 'END') {
        // 「ちゃん、ちゃん」で締める
        if (inBar === 0) { const ch = this.chords.Am; this.oom(ch[0], t, e * 2); this.pah(ch[2], t, e * 1.5); }
        if (inBar === 4) { const ch = this.chords.E; this.oom(ch[0], t, e * 0.8); this.pah(ch[2], t, e * 0.7); }
        if (inBar === 6) { const ch = this.chords.Am; this.oom(ch[0], t, e * 0.9); this.pah(ch[2], t, e * 0.8); }
      } else if (inBar % 2 === 0) {
        const name = Array.isArray(pr) ? pr[inBar < 4 ? 0 : 1] : pr;
        const ch = this.chords[name];
        if (inBar === 0 || inBar === 4) {
          this.oom(inBar === 0 || Array.isArray(pr) ? ch[0] : ch[1], t, e * 1.4);
          this.kick(t);
        } else {
          this.pah(ch[2], t, e * 0.6);
        }
      }
      this.nextTime += e;
      this.step++;
      if (this.step % totalSteps === 0) this.melIdx = 0;
    }
  },

  // ---- 効果音 ----
  jump() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(400, t);
    o.frequency.exponentialRampToValueAtTime(1400, t + 0.18);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + 0.26);
    // キラッ
    [88, 93].forEach((m, i) => this.tone('triangle', m, t + 0.12 + i * 0.06, 0.08, 0.15, this.sfxGain, false));
  },
  poke() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.tone('square', 50, t, 0.07, 0.15, this.sfxGain, false);
  },
  sizzle() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noise;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 4000; f.Q.value = 0.8;
    const g = c.createGain();
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    s.connect(f); f.connect(g); g.connect(this.sfxGain);
    s.start(t); s.stop(t + 0.4);
  },
  // 昇天：ぽわんと気球がふくらみ、天の和音
  ascend() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(720, t + 0.35);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + 0.42);
    // 「あ〜」と天使の和音（ゆっくり立ち上がって消える）
    [81, 84, 88, 93].forEach((m, i) => {
      const v = c.createOscillator(), vg = c.createGain(), lf = c.createOscillator(), lg = c.createGain();
      v.type = i % 2 ? 'triangle' : 'sine';
      v.frequency.value = this.freq(m);
      lf.frequency.value = 5 + i * 0.3; lg.gain.value = this.freq(m) * 0.006;
      lf.connect(lg); lg.connect(v.frequency);
      const st = t + 0.15 + i * 0.05;
      vg.gain.setValueAtTime(0.0001, st);
      vg.gain.linearRampToValueAtTime(0.05, st + 0.4);
      vg.gain.exponentialRampToValueAtTime(0.0001, st + 1.8);
      v.connect(vg); vg.connect(this.sfxGain);
      v.start(st); lf.start(st); v.stop(st + 1.9); lf.stop(st + 1.9);
    });
  },
  // 生地を流し込んだ瞬間の「ジュッ」
  jutt() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noise;
    s.playbackRate.value = 0.9 + Math.random() * 0.2;
    const hp = c.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1200;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(6500, t);
    bp.frequency.exponentialRampToValueAtTime(2800, t + 0.45);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.38, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.18);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    s.connect(hp); hp.connect(bp); bp.connect(g); g.connect(this.sfxGain);
    s.start(t, Math.random() * 0.2); s.stop(t + 0.52);
  },
  // 水分が抜けて焼き固まる「パチパチ」「チリチリ」
  crackle(strong) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + Math.random() * 0.02;
    const s = c.createBufferSource();
    s.buffer = this.noise;
    const f = c.createBiquadFilter();
    const pachi = strong && Math.random() < 0.35;
    f.type = pachi ? 'bandpass' : 'highpass';
    f.frequency.value = pachi ? 1800 + Math.random() * 1500 : 4500 + Math.random() * 4000;
    f.Q.value = pachi ? 1.5 : 0.7;
    const g = c.createGain();
    const vol = pachi ? 0.12 + Math.random() * 0.1 : 0.03 + Math.random() * 0.05;
    const len = pachi ? 0.012 + Math.random() * 0.01 : 0.004 + Math.random() * 0.008;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f); f.connect(g); g.connect(this.sfxGain);
    s.start(t, Math.random() * 0.4); s.stop(t + len + 0.01);
  },
  // あんこを「ぽてっ」
  anko() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.12);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t); o.stop(t + 0.18);
  },
  // 型を閉じる「ガチャン」／開ける「カチャ」
  clank(close) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noise;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = close ? 1800 : 3200; f.Q.value = 3;
    const g = c.createGain();
    g.gain.setValueAtTime(close ? 0.45 : 0.25, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (close ? 0.18 : 0.1));
    s.connect(f); f.connect(g); g.connect(this.sfxGain);
    s.start(t); s.stop(t + 0.2);
    [close ? 52 : 64, close ? 59 : 71].forEach((m, i) => {
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'square';
      o.frequency.value = this.freq(m) * (1 + i * 0.013);
      og.gain.setValueAtTime(close ? 0.06 : 0.035, t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(og); og.connect(this.sfxGain);
      o.start(t); o.stop(t + 0.14);
    });
  },
  gameOver() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [[72,0],[71,0.18],[70,0.36],[69,0.54]].forEach(([m, d], i) =>
      this.tone('square', m, t + d, i === 3 ? 0.7 : 0.16, 0.22, this.sfxGain, i === 3));
  },
};

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();
  Sound.init(); Sound.resume();
  Sound.setMuted(!Sound.muted);
  muteBtn.textContent = Sound.muted ? '×' : '♪';
});

// ===================== ゲーム状態 =====================
const SLOTS = [];
// 業務用たい焼き機を2台：4列4段の型。左右の型で挟んで焼き、出来上がりは左右どちらかの型に
const ROWS = [342, 401, 460, 519];
const COL_W = 78, CELL_H = 56;
const MACHINES = [{ hinge: 90, cells: [10, 92] }, { hinge: 270, cells: [190, 272] }];
const PLATE_X = 8, PLATE_Y = 306, PLATE_W = 344, PLATE_H = 248;
const PLATES = [], MOLDS = [], BOLTS = [];
MACHINES.forEach((m, mi) => {
  for (const y of ROWS) {
    const cells = m.cells.map(x => ({ x, y: y - CELL_H / 2, w: COL_W, h: CELL_H }));
    cells.forEach((c, side) => {
      PLATES.push(c);
      MOLDS.push({ x: c.x + c.w / 2, y, flip: side === 0 });
      const bx = side === 0 ? c.x + 6 : c.x + c.w - 6;
      BOLTS.push({ x: bx, y: c.y + 6 }, { x: bx, y: c.y + c.h - 6 });
    });
    SLOTS.push({ m: mi, hinge: m.hinge, y, cells, xs: cells.map(c => c.x + c.w / 2), outer: mi === 0 ? 0 : 1 });
  }
});
// 取っ手の位置（型の外側のふち）
function handleOf(s, side) {
  const c = s.cells[side];
  const left = c.x + c.w / 2 < s.hinge;
  return { x: left ? c.x : c.x + c.w, dir: left ? -1 : 1, sc: side === s.outer ? 1 : 0.65 };
}
function drawHandleOf(s, side) {
  const h = handleOf(s, side);
  drawHandle(h.x, s.y, h.dir, h.sc);
}
// 毎回どちら側を受けにするか決める（もう片方がふたになる）
function chooseSide(s) {
  s.base = Math.random() < 0.5 ? 0 : 1;
  s.x = s.xs[s.base];
  s.lx = s.xs[1 - s.base];
  s.face = s.base === 0 ? -1 : 1;
  s.lid = s.cells[1 - s.base];
}
// 1段の流れ
const PH = { pour: 0.55, anko: 0.5, pour2: 0.45, closing: 0.35, opening: 0.3 };

let state = 'title'; // title | play | over
let slots, flyers, particles, texts, score, best = loadBest(), elapsed, overAt, caughtSlot;
let tongs, hands;
const PLATE_Z = 140;
const BALLOON_COLORS = [['#e8463a', '#f8f1e4'], ['#2f6fd0', '#ffd23f'], ['#4cae5c', '#f8f1e4'], ['#ef7fa8', '#fff6fa'], ['#8a5cd0', '#ffd23f'], ['#f39a2b', '#fff3d6']];
const minJerk = p => p * p * p * (10 - 15 * p + 6 * p * p);

function reset() {
  const order = SLOTS.map((_, i) => i).sort(() => Math.random() - 0.5);
  slots = SLOTS.map((p, i) => ({
    ...p, i,
    phase: 'empty', t: 0,
    wait: 0.3 + Math.random() * 0.8 + order.indexOf(i) * 0.7,
    cook: 0, cookTime: 4,
    doneAt: 0, deadline: 0,
    shake: 0,
  }));
  slots.forEach(chooseSide);
  flyers = [];
  particles = [];
  texts = [];
  score = 0;
  elapsed = 0;
  caughtSlot = null;
  tongs = { x: 285, y: 300, target: null, startT: 0 };
  hands = [0, 1].map(i => {
    const idle = { x: i ? 222 : 138, y: 293, z: 150 }; // 鉄板の奥のふちに手を置く
    return { i, idle, x: idle.x, y: idle.y, z: idle.z, from: { ...idle }, target: null, startT: 0, delay: 0, p: 0, grip: 0.35, reach: 0, lift: 0, miss: 0 };
  });
}
reset();

// 難易度
function cookTimeNow() {
  const base = Math.max(2.4, 5.2 - elapsed * 0.03 - score * 0.02);
  return base * (0.8 + Math.random() * 0.5);
}
function grabWindowNow() {
  return Math.max(0.6, 1.7 - score * 0.022 - elapsed * 0.004);
}

function startGame() {
  Sound.init(); Sound.resume();
  reset();
  state = 'play';
  Sound.tempo = 138;
  Sound.startBgm();
}

function gameOver(slot) {
  state = 'over';
  overAt = performance.now();
  caughtSlot = slot;
  slot.phase = 'taken';
  if (score > best) { best = score; saveBest(best); }
  Sound.stopBgm();
  Sound.gameOver();
}

// ===================== 入力 =====================
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / scale;
  const y = (e.clientY - r.top) / scale;
  if (state === 'title') { startGame(); return; }
  if (state === 'over') {
    if (performance.now() - overAt > 900) startGame();
    return;
  }
  // 一番近いたい焼きを探す
  let hit = null, bestD = Infinity;
  for (const s of slots) {
    const dx = (x - s.x) / 42, dy = (y - s.y) / 28;
    const d = dx * dx + dy * dy;
    if (d < 1 && d < bestD) { bestD = d; hit = s; }
  }
  if (!hit) return;
  if (hit.phase === 'done') {
    escape(hit);
  } else if (hit.phase !== 'empty') {
    if (hit.shake > 0) return;
    hit.shake = 0.5;
    Sound.poke();
    texts.push({ x: hit.x, y: hit.y - 30, text: 'まだ！', t: 0, color: '#fff' });
  }
});

function escape(s) {
  const now = elapsed;
  const timeLeft = s.deadline - now;
  const win = s.deadline - s.doneAt;
  score++;
  Sound.ascend();
  // 気球に乗せて昇天させる
  flyers.push({
    x: s.x, x0: s.x, y: s.y + 6, t: 0, face: s.face || 1,
    seed: Math.random() * 6.28,
    pal: BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)],
  });
  for (let k = 0; k < 12; k++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 140;
    particles.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, t: 0, life: 0.6, star: true });
  }
  const msg = timeLeft < win * 0.25 ? 'ギリギリ昇天!' : ['しょうてん〜', 'さようなら〜', '天国へ〜', 'お達者で〜', 'ありがとう〜'][Math.floor(Math.random() * 5)];
  texts.push({ x: s.x, y: s.y - 30, text: msg, t: 0, color: '#ffe066' });
  s.phase = 'empty';
  s.wait = 0.4 + Math.random() * 1.2;
  s.cook = 0;
}

// ===================== 更新 =====================
function update(dt) {
  if (state === 'play') {
    elapsed += dt;
    for (const s of slots) {
      if (s.shake > 0) s.shake -= dt;
      s.t += dt;
      const next = (ph) => { s.phase = ph; s.t = 0; };
      if (s.phase === 'empty') {
        s.wait -= dt;
        if (s.wait <= 0) {
          // ① 片側に皮（生地）を流し込む
          chooseSide(s);
          next('pour');
          s.cook = 0;
          s.cookTime = cookTimeNow();
          Sound.jutt();
        }
      } else if (s.phase === 'pour') {
        if (s.t >= PH.pour) { next('pour2'); Sound.jutt(); } // ② もう片方にも生地
      } else if (s.phase === 'pour2') {
        if (s.t >= PH.pour2) { next('anko'); Sound.anko(); } // ③ あんこをのせる
      } else if (s.phase === 'anko') {
        if (s.t >= PH.anko) next('closing'); // ④ 挟む
      } else if (s.phase === 'closing') {
        if (s.t >= PH.closing) { next('cooking'); Sound.clank(true); }
      } else if (s.phase === 'opening') {
        if (s.t >= PH.opening) {
          s.phase = 'done';
          s.doneAt = elapsed;
          s.deadline = elapsed + grabWindowNow();
          Sound.sizzle();
        }
      } else if (s.phase === 'cooking') {
        s.cook += dt / s.cookTime;
        // 焼き音：中盤ほどにぎやか、焼き上がり近くはチリチリ
        const rate = 6 + 22 * Math.sin(Math.PI * Math.min(1, s.cook));
        if (Math.random() < dt * rate) Sound.crackle(s.cook < 0.6);
        // 閉じた型のすきまから湯気
        if (Math.random() < dt * 4) particles.push({ x: s.x + (Math.random() - 0.5) * 60, y: s.y - 20, vx: 0, vy: -30, t: 0, life: 1.2, steam: true });
        if (s.cook >= 1) {
          s.cook = 1;
          next('opening'); // ⑥ 焼けたら開く
          Sound.clank(false);
        }
      } else if (s.phase === 'done') {
        if (elapsed >= s.deadline) { gameOver(s); break; }
      }
    }
    // おじさんの手：左右それぞれ、近い側で一番あぶないたい焼きを取りに行く
    if (state === 'play') {
      for (const h of hands) {
        let target = null;
        for (const s of slots) {
          if (s.phase !== 'done' || (s.x < 180) !== (h.i === 0)) continue;
          if (!target || s.deadline < target.deadline) target = s;
        }
        if (target !== h.target) {
          // 狙いが消えた（逃げられた）→ 空振りでにぎってから戻す
          if (h.target && !target && h.p > 0.45) h.miss = 0.35;
          h.target = target;
          h.from = { x: h.x, y: h.y, z: h.z };
          h.startT = elapsed;
          // 気づいてから手が動き出すまでの間（目と顔が先に向く）
          h.delay = target ? Math.min(0.28, (target.deadline - elapsed) * 0.22) * (h.reach > 0.3 ? 0.3 : 1) : 0;
        }
        if (target) {
          const t0 = h.startT + h.delay;
          const p = Math.max(0, Math.min(1, (elapsed - t0) / Math.max(0.01, target.deadline - t0)));
          const e = minJerk(p);
          const arc = Math.sin(Math.PI * p);
          h.x = h.from.x + (target.x - h.from.x) * e;
          h.y = h.from.y + (target.y - 2 - h.from.y) * e - arc * 34;
          h.z = h.from.z + (PLATE_Z - h.from.z) * e + arc * 25;
          h.p = p;
          h.reach = e;
          // 伸ばしながら指を開き、着く直前ににぎる
          h.grip = p < 0.75 ? 0.35 * (1 - p / 0.75) : (p - 0.75) / 0.25 * 0.95;
          h.look = target;
        } else if (h.miss > 0) {
          h.miss -= dt;
          h.grip += (1 - h.grip) * Math.min(1, dt * 18);
          h.p = 0;
        } else {
          const k = Math.min(1, dt * 4.5);
          const br = Math.sin(elapsed * 2.2 + h.i) * 1.5;
          h.x += (h.idle.x - h.x) * k;
          h.y += (h.idle.y + br - h.y) * k;
          h.z += (h.idle.z - h.z) * k;
          h.reach += (0 - h.reach) * k;
          h.grip += (0.4 - h.grip) * k;
          h.p = 0;
        }
      }
    }
  } else if (state === 'over' && caughtSlot) {
    // つかんで顔の前まで持ち上げる
    for (const h of hands) {
      if ((caughtSlot.x < 180) === (h.i === 0)) {
        h.lift = Math.min(1, h.lift + dt * 1.4);
        const e = 1 - Math.pow(1 - h.lift, 3);
        h.x = caughtSlot.x + ((h.i ? 215 : 145) - caughtSlot.x) * e;
        h.y = caughtSlot.y - 2 + (250 - caughtSlot.y) * e;
        h.z = PLATE_Z + 50 * e;
        h.grip = 0.95; h.reach = 1 - e * 0.5;
      } else {
        const k = Math.min(1, dt * 4);
        h.x += (h.idle.x - h.x) * k; h.y += (h.idle.y - h.y) * k; h.z += (h.idle.z - h.z) * k;
        h.reach += (0 - h.reach) * k;
      }
    }
  }
  // 2D表示用に、一番あぶない手をトング情報へ
  if (hands) {
    let u = null;
    for (const h of hands) if (h.target && (!u || h.target.deadline < u.target.deadline)) u = h;
    tongs.target = u ? u.target : null;
    tongs.startT = u ? u.startT : 0;
    const hh = state === 'over' && caughtSlot ? hands[caughtSlot.x < 180 ? 0 : 1] : (u || hands[1]);
    tongs.x = hh.x; tongs.y = hh.y;
  }

  for (const f of flyers) {
    f.t += dt;
    // ふくらんでから、ゆっくり、ゆっくり昇っていく
    if (f.t > 0.5) {
      const v = Math.min(34, 6 + (f.t - 0.5) * 9);
      f.y -= v * dt;
      f.x = f.x0 + Math.sin(f.t * 0.8 + f.seed) * 10 * Math.min(1, (f.t - 0.5) / 2);
    }
    if (Math.random() < dt * 2) particles.push({ x: f.x + (Math.random() - 0.5) * 50, y: f.y - 60 + (Math.random() - 0.5) * 60, vx: 0, vy: -10, t: 0, life: 1.2, sparkle: true });
  }
  flyers = flyers.filter(f => f.y > -160);
  for (const p of particles) {
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.star) p.vy += 300 * dt;
  }
  particles = particles.filter(p => p.t < p.life);
  for (const t of texts) t.t += dt;
  texts = texts.filter(t => t.t < 1);
}

// ===================== 描画 =====================
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function lerpColor(a, b, t) {
  const r = Math.round(a[0] + (b[0] - a[0]) * t);
  const g = Math.round(a[1] + (b[1] - a[1]) * t);
  const bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return `rgb(${r},${g},${bl})`;
}
function cookColor(c) {
  const raw = [246, 232, 190], mid = [236, 190, 110], done = [205, 125, 45];
  return c < 0.5 ? lerpColor(raw, mid, c * 2) : lerpColor(mid, done, (c - 0.5) * 2);
}

// たい焼きを描く（右向き）
function drawTaiyaki(x, y, s, cook, rot, face, wiggle) {
  if (sprites) {
    const yaw = wiggle ? Math.sin(wiggle * 0.3) * 0.6 : 0;
    const img = sprites.get(cook, yaw);
    const w = sprites.unitW * PX_PER_UNIT, h = sprites.unitH * PX_PER_UNIT;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.scale(s * (face < 0 ? -1 : 1), s);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.scale(s * (face < 0 ? -1 : 1), s);
  const body = cookColor(cook);
  const edge = lerpColor([215, 195, 150], [130, 70, 20], cook);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = edge;
  ctx.fillStyle = body;
  // しっぽ
  const tw = Math.sin(wiggle || 0) * 6;
  ctx.beginPath();
  ctx.moveTo(-30, 0);
  ctx.quadraticCurveTo(-42, -4, -54, -20 + tw);
  ctx.quadraticCurveTo(-48, 0 + tw * 0.5, -54, 20 + tw);
  ctx.quadraticCurveTo(-42, 4, -30, 0);
  ctx.fill(); ctx.stroke();
  // 背びれ・腹びれ
  ctx.beginPath();
  ctx.moveTo(-18, -24); ctx.quadraticCurveTo(0, -38, 16, -24); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-10, 24); ctx.quadraticCurveTo(2, 34, 10, 24); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 体
  ctx.beginPath();
  ctx.moveTo(44, 0);
  ctx.bezierCurveTo(40, -24, 10, -30, -10, -26);
  ctx.bezierCurveTo(-26, -22, -36, -8, -36, 0);
  ctx.bezierCurveTo(-36, 8, -26, 22, -10, 26);
  ctx.bezierCurveTo(10, 30, 40, 24, 44, 0);
  ctx.fill(); ctx.stroke();
  // 焼き色のハイライト
  if (cook > 0.3) {
    const g = ctx.createRadialGradient(5, -6, 2, 5, -6, 34);
    g.addColorStop(0, `rgba(255,230,160,${0.5 * cook})`);
    g.addColorStop(1, 'rgba(255,230,160,0)');
    ctx.fillStyle = g;
    ctx.fill();
  }
  // うろこ
  ctx.strokeStyle = lerpColor([225, 205, 160], [150, 85, 25], cook);
  ctx.lineWidth = 1.8;
  for (let r = 0; r < 3; r++) {
    for (let k = 0; k < 3; k++) {
      const sx = -20 + k * 13 + (r % 2) * 6, sy = -12 + r * 10;
      ctx.beginPath();
      ctx.arc(sx, sy, 5.5, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
    }
  }
  // えら
  ctx.beginPath();
  ctx.arc(22, 0, 16, -1.1, 1.1);
  ctx.stroke();
  // 目
  ctx.fillStyle = cook > 0.6 ? '#3a1a05' : lerpColor([220, 200, 160], [60, 30, 10], cook);
  ctx.beginPath(); ctx.arc(32, -8, 4, 0, Math.PI * 2); ctx.fill();
  if (cook > 0.6) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(33.3, -9.5, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  // 口
  ctx.strokeStyle = edge;
  ctx.beginPath(); ctx.arc(42, 5, 3, 0.5, 2.2); ctx.stroke();
  ctx.restore();
}

function drawBackground() {
  // 壁
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f6d7a0');
  g.addColorStop(0.45, '#e9b979');
  g.addColorStop(1, '#6b3d1e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 板張り
  ctx.strokeStyle = 'rgba(120,70,30,0.15)';
  ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 30) {
    ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x, 290); ctx.stroke();
  }
  // のれん
  const nw = W / 4;
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = '#1f3a6e';
    rr(i * nw + 2, -10, nw - 4, 74, 4);
    ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px "Hiragino Mincho ProN", "Yu Mincho", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ['た', 'い', 'や', 'き'].forEach((ch, i) => ctx.fillText(ch, i * nw + nw / 2, 30));
  // 棒
  ctx.fillStyle = '#5a3418';
  ctx.fillRect(0, 0, W, 6);
}

function drawOjisan() {
  const cx = 180, cy = 160;
  const danger = tongs.target ? Math.min(1, (elapsed - tongs.startT) / Math.max(0.01, tongs.target.deadline - tongs.startT)) : 0;
  const happy = state === 'over';
  // 体（白い作務衣）
  ctx.fillStyle = '#f4f1ea';
  ctx.strokeStyle = '#8a7a66';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 95, 300);
  ctx.quadraticCurveTo(cx - 90, 220, cx - 40, 210);
  ctx.lineTo(cx + 40, 210);
  ctx.quadraticCurveTo(cx + 90, 220, cx + 95, 300);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // えり
  ctx.strokeStyle = '#2c4b85';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx - 25, 212); ctx.lineTo(cx + 5, 270);
  ctx.moveTo(cx + 25, 212); ctx.lineTo(cx - 5, 260);
  ctx.stroke();
  // 首
  ctx.fillStyle = '#e8b48a';
  ctx.fillRect(cx - 16, 195, 32, 20);
  // 顔
  ctx.fillStyle = '#f0c49c';
  ctx.strokeStyle = '#b07d55';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 52, 56, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // 耳
  ctx.beginPath(); ctx.ellipse(cx - 52, cy + 4, 9, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx + 52, cy + 4, 9, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 頭（短い白髪まじり）
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.ellipse(cx, cy - 34, 50, 26, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  // ねじりはちまき
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#c33';
  ctx.lineWidth = 2;
  rr(cx - 54, cy - 42, 108, 16, 7);
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = '#d44';
  ctx.lineWidth = 3;
  for (let x = cx - 60; x < cx + 60; x += 10) {
    ctx.beginPath(); ctx.moveTo(x, cy - 42); ctx.lineTo(x + 8, cy - 26); ctx.stroke();
  }
  ctx.restore();
  // 結び目
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(cx + 54, cy - 38, 10, 6, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 60, cy - 46, 10, 5, -1.2, 0, Math.PI * 2); ctx.fill();
  // まゆ
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  const tilt = happy ? -3 : danger * 6;
  ctx.beginPath(); ctx.moveTo(cx - 34, cy - 14 - tilt); ctx.lineTo(cx - 12, cy - 12 + tilt); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 34, cy - 14 - tilt); ctx.lineTo(cx + 12, cy - 12 + tilt); ctx.stroke();
  // 目（狙っているたい焼きを見る）
  let lx = 0, ly = 0;
  if (tongs.target) { lx = (tongs.target.x - cx) / 40; ly = 2; }
  if (happy) {
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx - 22, cy + 2, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 22, cy + 2, 7, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx - 22, cy, 9, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 22, cy, 9, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(cx - 22 + lx, cy + ly, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 22 + lx, cy + ly, 4.5, 0, Math.PI * 2); ctx.fill();
    if (danger > 0.5) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx - 20 + lx, cy - 2 + ly, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 24 + lx, cy - 2 + ly, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  // ほっぺ
  ctx.fillStyle = 'rgba(230,110,90,0.35)';
  ctx.beginPath(); ctx.ellipse(cx - 34, cy + 20, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 34, cy + 20, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
  // 鼻
  ctx.fillStyle = '#e3a57c';
  ctx.beginPath(); ctx.ellipse(cx, cy + 12, 8, 10, 0, 0, Math.PI * 2); ctx.fill();
  // ひげ
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.moveTo(cx, cy + 22);
  ctx.quadraticCurveTo(cx - 20, cy + 16, cx - 32, cy + 30);
  ctx.quadraticCurveTo(cx - 14, cy + 30, cx, cy + 26);
  ctx.quadraticCurveTo(cx + 14, cy + 30, cx + 32, cy + 30);
  ctx.quadraticCurveTo(cx + 20, cy + 16, cx, cy + 22);
  ctx.fill();
  // 口
  ctx.strokeStyle = '#7a3a2a';
  ctx.lineWidth = 3;
  if (happy) {
    ctx.fillStyle = '#7a2a1a';
    ctx.beginPath(); ctx.arc(cx, cy + 34, 12, 0, Math.PI); ctx.fill();
  } else if (danger > 0.3) {
    ctx.beginPath(); ctx.moveTo(cx - 8, cy + 38); ctx.quadraticCurveTo(cx, cy + 34, cx + 8, cy + 38); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(cx - 8, cy + 36); ctx.quadraticCurveTo(cx, cy + 40, cx + 8, cy + 36); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  drawOjisanBubble();
}

function dangerLevel() {
  let d = 0;
  if (hands) for (const h of hands) if (h.target) d = Math.max(d, h.p);
  return d;
}

function drawOjisanBubble() {
  const cx = 180;
  const danger = dangerLevel();
  const happy = state === 'over';
  if (state === 'play' && danger > 0.15) {
    drawBubble(cx - 112, 135, 'よし、\n焼けたな…');
  }
  if (happy) drawBubble(cx - 112, 135, 'へい、\nいっちょあがり！');
}

function drawBubble(x, y, text) {
  const lines = text.split('\n');
  ctx.font = 'bold 13px sans-serif';
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 18;
  const h = lines.length * 17 + 10;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  rr(x - w / 2, y - h / 2, w, h, 10);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + w / 2 - 6, y + 2);
  ctx.lineTo(x + w / 2 + 14, y + 14);
  ctx.lineTo(x + w / 2 - 4, y + 12);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, x, y - (lines.length - 1) * 8.5 + i * 17));
}

let plateImg = null, plateTried = false;

// ステンレスのヘアライン
function steel(x, y, w, h, light) {
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, light ? '#eef0f2' : '#c9ccd0');
  g.addColorStop(0.5, light ? '#c4c8cc' : '#a3a7ac');
  g.addColorStop(1, light ? '#dfe2e5' : '#8d9196');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  for (let i = 0; i < h; i += 2) {
    ctx.strokeStyle = `rgba(255,255,255,${0.05 + 0.08 * Math.abs(Math.sin(i * 12.9898) % 1)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y + i + 0.5); ctx.lineTo(x + w, y + i + 0.5); ctx.stroke();
  }
  ctx.restore();
}

function drawDial(x, y, label, ang) {
  ctx.fillStyle = '#2a2a2c';
  ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, 12);
  g.addColorStop(0, '#6a6a70'); g.addColorStop(1, '#141416');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * 10, y + Math.sin(ang) * 10); ctx.stroke();
  ctx.fillStyle = '#333';
  for (let i = 0; i < 9; i++) {
    const a = Math.PI * 0.75 + i * Math.PI * 1.5 / 8;
    ctx.fillRect(x + Math.cos(a) * 18 - 0.75, y + Math.sin(a) * 18 - 0.75, 1.5, 1.5);
  }
  ctx.font = 'bold 6px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + 24);
}

function drawPlate() {
  // 台（カウンター）
  ctx.fillStyle = '#4a2a14';
  ctx.fillRect(0, 290, W, H - 290);
  // 本体の天板（ステンレス）
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  rr(4, 298, W - 8, 270, 8); ctx.fill();
  steel(6, 296, W - 12, 266, true);
  ctx.strokeStyle = '#7d8186'; ctx.lineWidth = 1.5;
  ctx.strokeRect(6.5, 296.5, W - 13, 265);
  // 焼き型の影
  for (const p of PLATES) {
    ctx.fillStyle = 'rgba(20,20,24,0.55)';
    rr(p.x - 2, p.y - 1, p.w + 4, p.h + 6, 8); ctx.fill();
  }
  // 真ん中のちょうつがいの軸
  const hg = ctx.createLinearGradient(174, 0, 186, 0);
  hg.addColorStop(0, '#55585c'); hg.addColorStop(0.5, '#c8ccd0'); hg.addColorStop(1, '#4a4d51');
  ctx.fillStyle = hg;
  ctx.fillRect(176, 302, 8, 252);

  if (!plateTried) {
    plateTried = true;
    try {
      plateImg = renderPlate({ x: PLATE_X, y: PLATE_Y, w: PLATE_W, h: PLATE_H, ppu: PX_PER_UNIT, rects: PLATES, slots: MOLDS, bolts: BOLTS, scale: 2 });
    } catch (e) { console.warn('鉄板の3D描画に失敗', e); plateImg = null; }
  }
  if (plateImg) {
    ctx.drawImage(plateImg, PLATE_X, PLATE_Y, PLATE_W, PLATE_H);
  } else {
    for (const p of PLATES) {
      ctx.fillStyle = '#4a4440';
      rr(p.x, p.y, p.w, p.h, 10); ctx.fill();
    }
    for (const sl of MOLDS) {
      ctx.fillStyle = '#1c1a18';
      ctx.beginPath(); ctx.ellipse(sl.x, sl.y, 36, 17, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 熱のゆらぎ
  const t = performance.now() / 1000;
  ctx.fillStyle = 'rgba(255,140,60,0.05)';
  for (const p of PLATES) {
    ctx.fillRect(p.x, p.y + Math.sin(t * 3) * 1.5, p.w, p.h);
  }
  // 正面パネル
  steel(6, 562, W - 12, H - 562, false);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(6, 562, W - 12, 3);
  // ランプ
  const lampOn = Math.sin(t * 2) > -0.3;
  ctx.fillStyle = '#123';
  rr(80, 578, 22, 12, 3); ctx.fill();
  ctx.fillStyle = '#2ecc40';
  rr(82, 580, 18, 8, 2); ctx.fill();
  ctx.fillStyle = '#123';
  rr(80, 598, 22, 12, 3); ctx.fill();
  ctx.fillStyle = lampOn ? '#ff3b30' : '#7a1a14';
  rr(82, 600, 18, 8, 2); ctx.fill();
  if (lampOn) {
    ctx.fillStyle = 'rgba(255,60,40,0.25)';
    ctx.beginPath(); ctx.arc(91, 604, 12, 0, Math.PI * 2); ctx.fill();
  }
  drawDial(140, 595, 'TEMP', 0.3);
  drawDial(255, 595, 'TIMER', -2.2 + (t * 0.2) % 3);
  // 電源スイッチ
  ctx.fillStyle = '#222';
  rr(48, 586, 20, 24, 4); ctx.fill();
  ctx.fillStyle = '#555';
  rr(51, 589, 14, 10, 2); ctx.fill();
}

// 赤い取っ手（dir: -1 左向き / 1 右向き）
function drawHandle(x, y, dir, sc = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir * sc, sc);
  ctx.fillStyle = '#8a6a2a';
  ctx.fillRect(0, -3, 6, 6);
  ctx.fillStyle = '#b9bcc0';
  ctx.fillRect(5, -2, 4, 4);
  const g = ctx.createLinearGradient(0, -6, 0, 6);
  g.addColorStop(0, '#ff6a5a'); g.addColorStop(0.45, '#d8261c'); g.addColorStop(1, '#8a120c');
  ctx.fillStyle = g;
  rr(8, -5, 18, 10, 5); ctx.fill();
  ctx.restore();
}

// 生地（生のたい焼き＋とろっとしたツヤ）
function drawBatter(x, y, face, amount) {
  const sc = 0.55 + 0.45 * Math.min(1, amount);
  ctx.globalAlpha = Math.min(1, 0.3 + amount);
  drawTaiyaki(x, y, sc, 0, 0, face, 0);
  ctx.globalAlpha = 0.35 * Math.min(1, amount);
  ctx.fillStyle = '#fff3a8';
  ctx.beginPath(); ctx.ellipse(x - 4 * K * face, y - 4 * K, 28 * sc * K, 10 * sc * K, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

// あんこ（つぶあんのかたまり）
function drawAnko(x, y, drop) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(K, K); ctx.translate(-x, -y);
  const yy = y - 26 * (1 - drop);
  ctx.globalAlpha = Math.min(1, drop * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x - 2, y + 4, 30, 6, 0, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createLinearGradient(0, yy - 7, 0, yy + 7);
  g.addColorStop(0, '#7a3530'); g.addColorStop(1, '#3a1512');
  ctx.fillStyle = g;
  rr(x - 32, yy - 6, 58, 11, 5); ctx.fill();
  // つぶ
  for (let i = 0; i < 16; i++) {
    const px = x - 29 + ((i * 37) % 53), py = yy - 3 + ((i * 53) % 7);
    ctx.fillStyle = i % 3 ? '#5a2220' : '#7d3a34';
    ctx.beginPath(); ctx.ellipse(px, py, 2.4, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ふた（左の型）の角度 0=開いている π=閉じている
function lidAngle(s) {
  if (s.phase === 'closing') { const p = Math.min(1, s.t / PH.closing); return Math.PI * p * p; }
  if (s.phase === 'cooking') return Math.PI;
  if (s.phase === 'opening') { const p = Math.min(1, s.t / PH.opening); return Math.PI * (1 - p) * (1 - p * 0.0); }
  return 0;
}

function drawLidBack(l) {
  // ふたの裏（鋳物の背中とリブ）
  const g = ctx.createLinearGradient(0, l.y, 0, l.y + l.h);
  g.addColorStop(0, '#3a3a3d'); g.addColorStop(0.5, '#1d1d1f'); g.addColorStop(1, '#121213');
  ctx.fillStyle = g;
  rr(l.x, l.y, l.w, l.h, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  rr(l.x + 0.5, l.y + 0.5, l.w - 1, l.h - 1, 6); ctx.stroke();
  // 魚の形のふくらみ
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.beginPath(); ctx.ellipse(l.x + l.w / 2, l.y + l.h / 2, l.w * 0.34, l.h * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  for (const rx of [0.22, 0.78]) {
    ctx.beginPath(); ctx.moveTo(l.x + l.w * rx, l.y + 6); ctx.lineTo(l.x + l.w * rx, l.y + l.h - 6); ctx.stroke();
  }
}

function drawRow(s) {
  const l = s.lid;
  const a = lidAngle(s);
  const H = s.hinge, f = s.face;
  // --- 受け側の中身 ---
  const ph = s.phase;
  if (ph === 'pour') drawBatter(s.x, s.y, f, s.t / PH.pour);
  if (ph === 'pour2' || ph === 'anko' || ph === 'closing') drawBatter(s.x, s.y, f, 1);
  if (ph === 'anko' || ph === 'closing') drawAnko(s.x, s.y, ph === 'anko' ? Math.min(1, s.t / (PH.anko * 0.6)) : 1);
  if (ph === 'opening') drawTaiyaki(s.x, s.y, 1, 1, 0, f, 0);
  drawHandleOf(s, s.base);
  if (a === 0) {
    // ふたは開いたまま：ふた側の生地と取っ手
    if (ph === 'pour2') drawBatter(s.lx, s.y, -f, s.t / PH.pour2);
    if (ph === 'anko') drawBatter(s.lx, s.y, -f, 1);
    drawHandleOf(s, 1 - s.base);
    return;
  }
  // --- ふたが持ち上がっている：下の本体が見える ---
  ctx.fillStyle = '#4b4e52';
  rr(l.x, l.y, l.w, l.h, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(255,110,40,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(l.x + 8, s.y); ctx.lineTo(l.x + l.w - 8, s.y); ctx.stroke();
  // --- ふた（ちょうつがいを軸にパタンと回る） ---
  const c = Math.cos(a), lift = Math.sin(a) * 8;
  ctx.save();
  ctx.translate(H, -lift);
  ctx.scale(c, 1);
  ctx.translate(-H, 0);
  if (c > 0) {
    // 型の面が見えている
    if (plateImg) {
      const m = 2;
      ctx.drawImage(plateImg, (l.x - m - PLATE_X) * 2, (l.y - m - PLATE_Y) * 2, (l.w + m * 2) * 2, (l.h + m * 2) * 2,
        l.x - m, l.y - m, l.w + m * 2, l.h + m * 2);
    } else {
      ctx.fillStyle = '#222'; rr(l.x, l.y, l.w, l.h, 5); ctx.fill();
    }
    if (ph === 'closing') drawBatter(s.lx, s.y, -f, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.5 * (1 - c)})`;
    rr(l.x, l.y, l.w, l.h, 5); ctx.fill();
  } else {
    drawLidBack(l);
    ctx.fillStyle = `rgba(255,255,255,${0.12 * (1 + c)})`;
    rr(l.x, l.y, l.w, l.h, 5); ctx.fill();
  }
  drawHandleOf(s, 1 - s.base);
  ctx.restore();
  // 焼け具合バー（閉じたふたの上）
  if (ph === 'cooking') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    rr(s.x - 24, s.y + 13, 48, 5, 2.5); ctx.fill();
    ctx.fillStyle = '#f0a030';
    rr(s.x - 24, s.y + 13, 48 * Math.min(1, s.cook), 5, 2.5); ctx.fill();
  }
}

function drawSlots() {
  for (const s of slots) {
    let ox = 0, oy = 0;
    if (s.shake > 0) ox = Math.sin(s.shake * 60) * 3;
    if (s.phase === 'done') {
      const p = (elapsed - s.doneAt) / (s.deadline - s.doneAt);
      ox += Math.sin(elapsed * 40) * (1 + p * 3);
      oy += Math.sin(elapsed * 23) * p * 2;
      drawTaiyaki(s.x + ox, s.y + oy, 1, 1, 0, s.face, 0);
      // 光る輪（残り時間）
      ctx.strokeStyle = p > 0.66 ? '#ff4040' : '#ffd23f';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, 42, 25, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - p));
      ctx.stroke();
      ctx.fillStyle = '#fff6b0';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('！', s.x + 30, s.y - 20 + Math.sin(elapsed * 10) * 3);
      drawHandleOf(s, s.outer);
    } else if (s.phase === 'empty' || s.phase === 'taken') {
      drawHandleOf(s, s.outer);
    } else {
      ctx.save();
      ctx.translate(ox, 0);
      drawRow(s);
      ctx.restore();
    }
  }
}

// 軍手をはめた手（店主は手でつかんで取る）
function drawGlove(x, y, ang, open) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  // ここでは +x が指先の向き
  const base = '#eeece4', shade = '#c9c5b8', line = '#8f8a7c';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = line;
  ctx.lineWidth = 1.5;
  // 指（4本）
  const spread = open ? 0.16 : 0.04;
  const flen = open ? 19 : 12;
  for (let i = 0; i < 4; i++) {
    const off = (i - 1.5) * 6.2;
    const a2 = (i - 1.5) * spread;
    ctx.save();
    ctx.translate(12, off);
    ctx.rotate(a2);
    ctx.fillStyle = base;
    rr(-2, -3.2, flen - (i === 0 || i === 3 ? 3 : 0), 6.4, 3.2);
    ctx.fill(); ctx.stroke();
    // 編み目
    ctx.strokeStyle = 'rgba(120,115,100,0.35)';
    ctx.lineWidth = 0.6;
    for (let k = 2; k < flen - 3; k += 2.5) {
      ctx.beginPath(); ctx.moveTo(k, -2.6); ctx.lineTo(k, 2.6); ctx.stroke();
    }
    ctx.strokeStyle = line; ctx.lineWidth = 1.5;
    ctx.restore();
  }
  // 親指
  ctx.save();
  ctx.translate(4, open ? -13 : -10);
  ctx.rotate(open ? -0.7 : -0.2);
  ctx.fillStyle = base;
  rr(-2, -3.5, 15, 7, 3.5); ctx.fill(); ctx.stroke();
  ctx.restore();
  // 手のひら（手の甲）
  const g = ctx.createLinearGradient(0, -14, 0, 14);
  g.addColorStop(0, base); g.addColorStop(1, shade);
  ctx.fillStyle = g;
  rr(-10, -13.5, 26, 27, 9); ctx.fill(); ctx.stroke();
  // 編み目の質感
  ctx.fillStyle = 'rgba(120,115,100,0.22)';
  for (let yy = -11; yy < 12; yy += 2.6) {
    for (let xx = -8 + ((yy * 7) & 1) * 1.3; xx < 14; xx += 2.6) {
      ctx.fillRect(xx, yy, 1, 1);
    }
  }
  // 生地のしみ（使い込んだ軍手）
  ctx.fillStyle = 'rgba(190,140,60,0.35)';
  ctx.beginPath(); ctx.ellipse(8, 6, 4, 2.5, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(120,90,50,0.25)';
  ctx.beginPath(); ctx.ellipse(-3, -7, 2.5, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  // そで口のゴム（黄色のふち）
  ctx.fillStyle = base;
  rr(-20, -12, 12, 24, 3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,115,100,0.5)';
  ctx.lineWidth = 0.8;
  for (let k = -18; k < -9; k += 2) {
    ctx.beginPath(); ctx.moveTo(k, -11); ctx.lineTo(k, 11); ctx.stroke();
  }
  ctx.fillStyle = '#e8c42a';
  ctx.fillRect(-21, -12, 2.5, 24);
  ctx.restore();
  ctx.lineCap = 'butt';
}

function drawTongs() {
  const sx = 245, sy = 245; // 右肩
  const tx = tongs.x, ty = tongs.y;
  // 手首の位置（指先がたい焼きに届く）
  const wx = tx + 18, wy = ty - 34;
  const ang = Math.atan2(ty - wy, tx - wx);
  // 腕（白い作務衣の袖）
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#d9d4c8';
  ctx.lineWidth = 28;
  const mx = (sx + wx) / 2 + 24, my = Math.min(sy, wy) - 12;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, wx, wy); ctx.stroke();
  ctx.strokeStyle = '#f4f1ea';
  ctx.lineWidth = 24;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, wx, wy); ctx.stroke();
  ctx.lineCap = 'butt';
  // 軍手
  const open = state === 'play' && !!tongs.target;
  drawGlove(wx + Math.cos(ang) * 6, wy + Math.sin(ang) * 6, ang, open);
}

// 天からの光（昇天）
function drawHeavenLight() {
  for (const f of flyers) {
    const a = Math.min(1, f.t / 1.2) * 0.22;
    if (a <= 0) continue;
    const g = ctx.createLinearGradient(0, 0, 0, f.y + 10);
    g.addColorStop(0, `rgba(255,250,215,${a})`);
    g.addColorStop(1, `rgba(255,250,215,${a * 0.4})`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(f.x - 30, 0); ctx.lineTo(f.x + 30, 0);
    ctx.lineTo(f.x + 48, f.y + 10); ctx.lineTo(f.x - 48, f.y + 10);
    ctx.closePath(); ctx.fill();
  }
}

// 熱気球にのったたい焼き（x,y = かごの中心）
function drawBalloon(f) {
  const inf = Math.min(1, f.t / 0.45);
  const sc = inf < 1 ? 1 - Math.pow(1 - inf, 3) * 1.0 + Math.sin(inf * Math.PI) * 0.12 : 1;
  const x = f.x, y = f.y;
  const R = 30;
  const ey = y - 78; // 球皮の中心
  const tilt = Math.sin(f.t * 0.8 + f.seed) * 0.05;
  ctx.save();
  // 鉄板の上にいる間は少し透けさせて、下のたい焼きが見えるように
  ctx.globalAlpha = 1;
  const over = y > 300 ? 0.62 + 0.38 * Math.min(1, Math.max(0, (360 - y) / 60)) : 1;
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.translate(-x, -y);
  // ロープ
  ctx.globalAlpha = inf * over;
  ctx.strokeStyle = '#6b5233';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 9 * sc, ey + 34 * sc); ctx.lineTo(x - 12, y - 7);
  ctx.moveTo(x + 9 * sc, ey + 34 * sc); ctx.lineTo(x + 12, y - 7);
  ctx.moveTo(x - 4 * sc, ey + 36 * sc); ctx.lineTo(x - 4, y - 7);
  ctx.moveTo(x + 4 * sc, ey + 36 * sc); ctx.lineTo(x + 4, y - 7);
  ctx.stroke();
  // バーナーの炎
  if (f.t > 0.4 && Math.sin(f.t * 3 + f.seed) > 0.2) {
    const fl = 6 + Math.random() * 4;
    const g = ctx.createLinearGradient(0, y - 20, 0, y - 20 - fl);
    g.addColorStop(0, '#3a7bff'); g.addColorStop(0.4, '#ffd23f'); g.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x - 3, y - 18); ctx.quadraticCurveTo(x, y - 20 - fl * 2, x + 3, y - 18); ctx.fill();
  }
  ctx.globalAlpha = over;
  // 球皮
  ctx.save();
  ctx.translate(x, ey);
  ctx.scale(sc, sc);
  ctx.beginPath();
  ctx.moveTo(0, -R * 1.12);
  ctx.bezierCurveTo(R * 1.38, -R * 1.12, R * 1.25, R * 0.55, 7, R * 1.18);
  ctx.lineTo(-7, R * 1.18);
  ctx.bezierCurveTo(-R * 1.25, R * 0.55, -R * 1.38, -R * 1.12, 0, -R * 1.12);
  ctx.closePath();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = f.pal[0];
  ctx.fillRect(-R * 1.5, -R * 1.5, R * 3, R * 3);
  // ゴア（縦じま）
  ctx.fillStyle = f.pal[1];
  for (const k of [2.6, 1.2]) {
    ctx.beginPath(); ctx.ellipse(0, -2, R * k / 3.2, R * 1.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = k === 2.6 ? f.pal[1] : f.pal[1];
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = f.pal[0];
    ctx.beginPath(); ctx.ellipse(0, -2, R * (k - 0.7) / 3.2, R * 1.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = f.pal[1];
  }
  // 丸みの陰影
  const sh = ctx.createRadialGradient(-R * 0.4, -R * 0.5, 2, 0, 0, R * 1.5);
  sh.addColorStop(0, 'rgba(255,255,255,0.45)');
  sh.addColorStop(0.45, 'rgba(255,255,255,0)');
  sh.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = sh;
  ctx.fillRect(-R * 1.5, -R * 1.5, R * 3, R * 3);
  // 帯
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(-R * 1.5, R * 0.55, R * 3, 3);
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
  // たい焼き（かごに乗って、しっぽが出ている）
  drawTaiyaki(x + f.face * 3, y - 10, 0.62, 1, -0.15 * f.face, f.face, 0);
  // 天使の輪
  if (f.t > 0.35) {
    ctx.strokeStyle = `rgba(255,215,80,${Math.min(1, (f.t - 0.35) * 3)})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(x + f.face * 12, y - 30 + Math.sin(f.t * 3) * 1.2, 9, 3, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // かご（籐編み）
  const bg = ctx.createLinearGradient(0, y - 8, 0, y + 10);
  bg.addColorStop(0, '#c08a4a'); bg.addColorStop(1, '#7a4e22');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(x - 15, y - 8); ctx.lineTo(x + 15, y - 8); ctx.lineTo(x + 12, y + 10); ctx.lineTo(x - 12, y + 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,40,15,0.6)';
  ctx.lineWidth = 0.8;
  for (let k = -12; k <= 12; k += 4) { ctx.beginPath(); ctx.moveTo(x + k, y - 8); ctx.lineTo(x + k * 0.8, y + 10); ctx.stroke(); }
  for (let k = -4; k <= 8; k += 4) { ctx.beginPath(); ctx.moveTo(x - 15 + (k + 8) * 0.17, y + k); ctx.lineTo(x + 15 - (k + 8) * 0.17, y + k); ctx.stroke(); }
  ctx.fillStyle = '#5a3412';
  rr(x - 16, y - 10, 32, 4, 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    if (p.steam) {
      ctx.fillStyle = `rgba(255,255,255,${0.25 * a})`;
      ctx.beginPath(); ctx.arc(p.x + Math.sin(p.t * 5) * 6, p.y, 6 + p.t * 8, 0, Math.PI * 2); ctx.fill();
    } else if (p.bubble) {
      ctx.strokeStyle = `rgba(180,230,255,${a})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3 + p.t * 6, 0, Math.PI * 2); ctx.stroke();
    } else if (p.sparkle) {
      ctx.fillStyle = `rgba(255,245,190,${Math.sin(Math.PI * p.t / p.life)})`;
      drawStar(p.x, p.y, 3);
    } else if (p.star) {
      ctx.fillStyle = `rgba(255,230,80,${a})`;
      drawStar(p.x, p.y, 5);
    }
  }
}
function drawStar(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2;
    const rr2 = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
  }
  ctx.closePath(); ctx.fill();
}

function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    ctx.globalAlpha = 1 - t.t;
    ctx.font = 'bold 18px sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.strokeText(t.text, t.x, t.y - t.t * 40);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y - t.t * 40);
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 18px sans-serif';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#3b2414';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  const s = `にがした数 ${score}`;
  ctx.strokeText(s, 12, 84); ctx.fillText(s, 12, 84);
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px sans-serif';
  const b = `ベスト ${best}`;
  ctx.strokeText(b, W - 12, 84); ctx.fillText(b, W - 12, 84);
}

function outlinedText(text, x, y, size, fill, stroke) {
  ctx.font = `900 ${size}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size / 5;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

function drawTitle() {
  ctx.fillStyle = 'rgba(30,15,5,0.6)';
  ctx.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  outlinedText('とべ！', W / 2, 150, 44, '#ffe066', '#7a3a10');
  outlinedText('たいやきちゃん', W / 2, 205, 40, '#fff', '#7a3a10');
  drawTaiyaki(W / 2, 290 + Math.sin(t * 3) * 10, 1.4, 1, Math.sin(t * 6) * 0.15, 1, t * 15);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  const lines = [
    'たい焼きが焼けたら、',
    'おじさんに取られる前に タップ！',
    'たい焼きちゃんを にがしてあげよう。',
    '',
    '１匹でも取られたら ゲームオーバー',
  ];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 380 + i * 24));
  if (Math.floor(t * 2) % 2 === 0) outlinedText('タップしてスタート', W / 2, 540, 24, '#fff', '#c33');
}

function drawOver() {
  ctx.fillStyle = 'rgba(30,15,5,0.55)';
  ctx.fillRect(0, 0, W, H);
  outlinedText('ゲームオーバー', W / 2, 330, 36, '#fff', '#a01010');
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('おじさんに 取られちゃった…', W / 2, 375);
  outlinedText(`にがした数　${score} 匹`, W / 2, 425, 28, '#ffe066', '#7a3a10');
  if (score >= best && score > 0) outlinedText('ベスト記録！', W / 2, 465, 20, '#7fffd4', '#0a4a3a');
  else {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`ベスト ${best} 匹`, W / 2, 465);
  }
  if (performance.now() - overAt > 900 && Math.floor(performance.now() / 500) % 2 === 0) {
    outlinedText('タップでもう一回', W / 2, 530, 22, '#fff', '#c33');
  }
}

function draw() {
  drawBackground();
  if (oj) {
    const danger = dangerLevel();
    let look = null;
    if (state === 'over' && caughtSlot) look = { x: tongs.x, y: tongs.y };
    else if (tongs.target) look = { x: tongs.target.x, y: tongs.target.y };
    oj.update(1 / 60, {
      t: performance.now() / 1000,
      tips: hands.map(h => ({ x: h.x, y: h.y, z: h.z, grip: h.grip, reach: h.reach })),
      look,
      mood: state === 'over' ? 'happy' : danger > 0.3 ? 'focus' : 'normal',
    });
    ctx.drawImage(oj.renderBody(), 0, oj.top, W, oj.height);
  } else {
    drawOjisan();
  }
  drawPlate();
  drawSlots();
  drawParticles();
  // 取られたたい焼き
  if (state === 'over' && caughtSlot) {
    drawTaiyaki(tongs.x, tongs.y + 4, 1, 1, Math.sin(performance.now() / 300) * 0.08, caughtSlot.face || 1, 0);
  }
  if (oj) {
    ctx.drawImage(oj.renderArms(), 0, oj.top, W, oj.height);
    drawOjisanBubble();
  } else if (state !== 'title') drawTongs();
  drawHeavenLight();
  for (const f of flyers) drawBalloon(f);
  drawTexts();
  drawHud();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
}

// ===================== ループ =====================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.addEventListener('visibilitychange', () => {
  if (!Sound.ctx) return;
  if (document.hidden) Sound.ctx.suspend(); else Sound.ctx.resume();
});
}
</script>
